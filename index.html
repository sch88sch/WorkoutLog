<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EFEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="description" content="Simple gym log with a daily summary.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3EFEB; --surface:#FFFFFF; --sunk:#E9E3DD; --ink:#231B17; --muted:#6B5F58; --line:#DDD4CD;
  --accent:#B24E2E; --accent-ink:#FFFFFF; --accent-soft:#F6E1D7;
  --up:#1F7A4A; --down:#B3261E; --same:#6B5F58;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141110; --surface:#1E1917; --sunk:#171311; --ink:#EFE8E3; --muted:#A3968E; --line:#342B27;
    --accent:#E8875F; --accent-ink:#1A0E09; --accent-soft:#3A241B;
    --up:#5CC48A; --down:#F0735F; --same:#A3968E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141110; --surface:#1E1917; --sunk:#171311; --ink:#EFE8E3; --muted:#A3968E; --line:#342B27;
  --accent:#E8875F; --accent-ink:#1A0E09; --accent-soft:#3A241B;
  --up:#5CC48A; --down:#F0735F; --same:#A3968E; color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 12px}
.brand{display:flex;align-items:baseline;gap:8px}
h1{margin:0;font:700 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.ver{font:500 12px var(--mono);color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:1px 6px}
.saved{font-size:12px;color:var(--muted);transition:opacity .3s}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--sunk);border-radius:10px;margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:10px 6px;border-radius:7px;font:600 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.lbl,label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.55}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 16px;min-height:44px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--down)}
.icon{border:0;background:transparent;color:var(--muted);min-width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:16px;flex:none}
.icon:hover{background:var(--sunk);color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font:600 12px var(--body);letter-spacing:.04em;text-transform:none}

.datebar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.datebar input{text-align:center;font-weight:600}
.datebar .btn{padding:0;font-size:20px}
.daylabel{text-align:center;margin:6px 0 16px;font:700 22px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}

.ex-list{display:flex;flex-direction:column;gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.ex-top{display:flex;gap:6px;align-items:center}
.ex-name{border:0;background:transparent;padding:4px 2px;min-height:36px;font:700 21px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.ex-name:focus{background:var(--sunk)}
.last{margin:0 2px 10px;font-size:13px;color:var(--muted)}
.last b{font:500 12.5px var(--mono);color:var(--ink)}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.set-h{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center}
.set-h span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.set-n{font:500 14px var(--mono);color:var(--muted);text-align:center}
.set input{text-align:center;font:500 17px var(--mono);font-variant-numeric:tabular-nums;padding:8px 4px}
.ex-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.ex-vol{font:500 12.5px var(--mono);color:var(--muted)}

.add{display:flex;gap:8px;margin-top:14px}
.mine{margin-top:14px}
.mine .head{display:flex;justify-content:space-between;align-items:baseline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chips.editing .chip{border-style:dashed;color:var(--down)}
.hint{font-size:13px;color:var(--muted);margin:0}
.notes{margin-top:18px}
.totals{margin-top:14px;text-align:center;font:500 13px var(--mono);color:var(--muted)}

.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.day-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.day-h h2{margin:0;font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.day-h .meta{font:500 12px var(--mono);color:var(--muted)}
.day ul{list-style:none;margin:0;padding:0}
.day li{padding:10px 0;border-bottom:1px solid var(--line)}
.day li:last-child{border-bottom:0}
.day .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.day .nm{font-weight:600}
.day .st{font:500 13.5px var(--mono);overflow-wrap:anywhere;margin-top:2px}
.day .pv{font-size:12.5px;color:var(--muted);margin-top:2px}
.cmp{font:600 12px var(--mono);white-space:nowrap}
.cmp.up{color:var(--up)} .cmp.down{color:var(--down)} .cmp.same{color:var(--same)} .cmp.new{color:var(--accent)}
.day-notes{margin:8px 0 0;font-size:14px;color:var(--muted);font-style:italic}
.day-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}

.empty{text-align:center;color:var(--muted);padding:36px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty h2{font:700 22px var(--display);text-transform:uppercase;color:var(--ink);margin:0 0 6px}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.backup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:24px}
.backup h2{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px}
.backup p{margin:0 0 12px;color:var(--muted);font-size:14px}
.backup .row{display:flex;gap:8px}
.backup .row .btn{flex:1}
.foot{text-align:center;font:500 12px var(--mono);color:var(--muted);margin-top:20px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (max-width:380px){.set,.set-h{grid-template-columns:22px 1fr 1fr 32px;gap:6px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Lift Log</h1><span class="ver" id="ver"></span></div>
    <span class="saved" id="saved"></span>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-log" data-tab="log" aria-selected="true">Log</button>
    <button role="tab" id="tab-summary" data-tab="summary" aria-selected="false">Summary</button>
  </nav>
  <main>
    <section id="view-log" role="tabpanel" aria-labelledby="tab-log"></section>
    <section id="view-summary" role="tabpanel" aria-labelledby="tab-summary" hidden></section>
  </main>
</div>
<input type="file" id="restore-file" accept=".json,application/json,text/plain" hidden>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
/* ======= Change this number every time you upload a new version ======= */
const APP_VERSION = 'v3';
/* ====================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => ymd(new Date());
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const shiftDate = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const num = v => { const n = parseFloat(String(v ?? '').replace(',','.')); return isFinite(n) ? n : null; };
const fmtN = n => String(Math.round(n*100)/100);
const fmtInt = n => Math.round(n).toLocaleString('en-US');
const key = n => String(n||'').trim().toLowerCase();
const fmtDate = (s, long=true) => { const d = parseD(s); const o = long ? {weekday:'short',day:'numeric',month:'short'} : {day:'numeric',month:'short'}; return d.toLocaleDateString('en-GB',o) + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const dayWord = s => { const t = todayStr(); if (s === t) return 'Today'; if (s === shiftDate(t,-1)) return 'Yesterday'; return parseD(s).toLocaleDateString('en-GB',{weekday:'long'}); };
const lsGet = (k,f) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

/* ---------- data ----------
   days:  { "2026-09-20": { date, exercises:[{name, sets:[{kg:"60", reps:"8"}]}], notes, updatedAt } }
   names: ["Bench Press", ...]   your own exercises, most recent first                        */
let savedT = null;
let days = lsGet('liftlog.days', null);
let names = lsGet('liftlog.names', []);
if (!days){ days = {}; importSessions(lsGet('liftlog.sessions', [])); saveAll(); }  // move data from v1/v2

function importSessions(list){
  for (const s of list || []){
    if (!s || !s.date || !Array.isArray(s.exercises)) continue;
    const d = days[s.date] ||= { date: s.date, exercises: [], notes: '', updatedAt: s.updatedAt || Date.now() };
    for (const ex of s.exercises) d.exercises.push({ name: ex.name, sets: (ex.sets||[]).map(x => ({ kg: x.kg ? fmtN(x.kg) : '', reps: String(x.reps ?? '') })) });
    if (s.notes) d.notes = d.notes ? d.notes + '\n' + s.notes : s.notes;
    for (const ex of s.exercises) rememberName(ex.name);
  }
}
function rememberName(n){
  n = String(n||'').trim(); if (!n) return;
  names = [n, ...names.filter(x => key(x) !== key(n))];
}
function saveAll(){
  const ok = lsSet('liftlog.days', days) && lsSet('liftlog.names', names);
  if (!ok) toast('Phone storage is full — back up, then delete old days');
  else flashSaved();
  return ok;
}
function flashSaved(){ const el = $('#saved'); el.textContent = 'Saved ✓'; el.style.opacity = 1; clearTimeout(savedT); savedT = setTimeout(() => el.style.opacity = 0, 1500); }

const validSets = ex => (ex.sets||[]).filter(s => num(s.reps) > 0);
const fmtSet = s => (num(s.kg) > 0 ? fmtN(num(s.kg)) + '×' : '') + num(s.reps) + (num(s.kg) > 0 ? '' : ' reps');
const exVol = ex => validSets(ex).reduce((t,s) => t + (num(s.kg)||0)*num(s.reps), 0);
function bestSet(ex){ let b = null; for (const s of validSets(ex)){ const kg = num(s.kg)||0, r = num(s.reps); if (!b || kg > b.kg || (kg === b.kg && r > b.reps)) b = { kg, reps: r }; } return b; }
function previousFor(name, beforeDate){
  const k = key(name);
  const dates = Object.keys(days).filter(d => d < beforeDate).sort().reverse();
  for (const d of dates){ const ex = days[d].exercises.find(e => key(e.name) === k && validSets(e).length); if (ex) return { date: d, ex }; }
  return null;
}
function compare(ex, prev){
  const a = bestSet(ex); if (!a) return null;
  if (!prev) return { cls: 'new', text: 'First time' };
  const b = bestSet(prev.ex);
  if (a.kg !== b.kg) return a.kg > b.kg ? { cls: 'up', text: '▲ +' + fmtN(a.kg-b.kg) + ' kg' } : { cls: 'down', text: '▼ ' + fmtN(a.kg-b.kg) + ' kg' };
  if (a.reps !== b.reps) return a.reps > b.reps ? { cls: 'up', text: '▲ +' + (a.reps-b.reps) + ' reps' } : { cls: 'down', text: '▼ ' + (a.reps-b.reps) + ' reps' };
  const va = exVol(ex), vb = exVol(prev.ex);
  if (va > vb) return { cls: 'up', text: '▲ more volume' };
  if (va < vb) return { cls: 'down', text: '▼ less volume' };
  return { cls: 'same', text: '= same as last' };
}

/* ---------- state ---------- */
const state = { tab: 'log', date: todayStr(), editNames: false, showDays: 30 };
const today = () => days[state.date];
function ensureDay(){ return days[state.date] ||= { date: state.date, exercises: [], notes: '', updatedAt: Date.now() }; }
function cleanDay(){ const d = days[state.date]; if (d && !d.exercises.length && !d.notes.trim()) delete days[state.date]; }
function touch(){ const d = days[state.date]; if (d) d.updatedAt = Date.now(); cleanDay(); saveAll(); }

/* ---------- log ---------- */
function exCard(ex, i){
  const prev = previousFor(ex.name, state.date);
  const ps = prev ? validSets(prev.ex) : [];
  return `<article class="ex" data-ex="${i}">
    <div class="ex-top">
      <input id="exn-${i}" class="ex-name" data-f="exname" data-ex="${i}" value="${esc(ex.name)}" aria-label="Exercise name" autocomplete="off">
      <button class="icon" data-act="del-ex" data-ex="${i}" aria-label="Remove ${esc(ex.name)}">✕</button>
    </div>
    <p class="last">${prev ? `Last time · ${esc(fmtDate(prev.date))} · <b>${ps.map(s => esc(fmtSet(s))).join('  ')}</b>` : 'No earlier record'}</p>
    <div class="sets">
      <div class="set-h" aria-hidden="true"><span>#</span><span>kg</span><span>Reps</span><span></span></div>
      ${ex.sets.map((s,j) => `<div class="set">
        <span class="set-n">${j+1}</span>
        <input id="kg-${i}-${j}" inputmode="decimal" data-f="kg" data-ex="${i}" data-set="${j}" value="${esc(s.kg)}" placeholder="${esc(ps[j] ? (num(ps[j].kg) > 0 ? fmtN(num(ps[j].kg)) : '') : 'kg')}" aria-label="Set ${j+1} weight in kg">
        <input id="rp-${i}-${j}" inputmode="numeric" data-f="reps" data-ex="${i}" data-set="${j}" value="${esc(s.reps)}" placeholder="${esc(ps[j] ? String(num(ps[j].reps)) : 'reps')}" aria-label="Set ${j+1} reps">
        <button class="icon" data-act="del-set" data-ex="${i}" data-set="${j}" aria-label="Remove set ${j+1}">−</button>
      </div>`).join('')}
    </div>
    <div class="ex-foot"><button class="btn sm" data-act="add-set" data-ex="${i}">+ Set</button><span class="ex-vol" data-vol="${i}">${exVol(ex) ? fmtInt(exVol(ex)) + ' kg' : ''}</span></div>
  </article>`;
}
function renderLog(){
  const d = today();
  const exs = d ? d.exercises : [];
  const inToday = new Set(exs.map(e => key(e.name)));
  const pick = names.filter(n => state.editNames || !inToday.has(key(n)));
  $('#view-log').innerHTML = `
    <div class="datebar">
      <button class="btn" data-act="prev" aria-label="Previous day">‹</button>
      <input type="date" id="log-date" value="${esc(state.date)}" aria-label="Date">
      <button class="btn" data-act="next" aria-label="Next day">›</button>
    </div>
    <p class="daylabel">${esc(dayWord(state.date))}</p>
    <div class="ex-list">${exs.map(exCard).join('')}</div>
    ${exs.length ? '' : `<p class="hint" style="text-align:center">Nothing logged for this day yet. Type an exercise below, or tap one of yours.</p>`}
    <div class="add">
      <input id="new-ex" placeholder="Type an exercise, e.g. Bench Press" autocomplete="off" aria-label="New exercise">
      <button class="btn primary" data-act="add-ex">Add</button>
    </div>
    <div class="mine">
      <div class="head"><span class="lbl">My exercises</span>${names.length ? `<button class="linkbtn" data-act="edit-names">${state.editNames ? 'Done' : 'Edit list'}</button>` : ''}</div>
      ${names.length
        ? `<div class="chips${state.editNames ? ' editing' : ''}">${pick.map(n => `<button class="chip" data-act="${state.editNames ? 'forget' : 'pick'}" data-name="${esc(n)}">${state.editNames ? '✕ ' : ''}${esc(n)}</button>`).join('') || '<span class="hint">All added for this day.</span>'}</div>`
        : `<p class="hint">Every exercise you type is saved here, so next time you just tap it.</p>`}
    </div>
    <div class="notes"><label for="notes">Notes for this day</label><textarea id="notes" data-f="notes" rows="2" placeholder="e.g. felt strong, try 65 kg next time">${esc(d ? d.notes : '')}</textarea></div>
    <p class="totals" id="totals"></p>`;
  updateTotals();
}
function updateTotals(){
  const d = today(); const el = $('#totals'); if (!el) return;
  if (!d || !d.exercises.length){ el.textContent = ''; return; }
  const sets = d.exercises.reduce((t,e) => t + validSets(e).length, 0);
  const vol = d.exercises.reduce((t,e) => t + exVol(e), 0);
  el.textContent = `${d.exercises.length} exercise${d.exercises.length === 1 ? '' : 's'} · ${sets} set${sets === 1 ? '' : 's'} · ${fmtInt(vol)} kg`;
}
function addExercise(name){
  name = String(name||'').trim(); if (!name){ $('#new-ex').focus(); return; }
  const d = ensureDay();
  const known = names.find(n => key(n) === key(name));
  if (known) name = known;
  if (d.exercises.some(e => key(e.name) === key(name))){ toast(name + ' is already in this day'); return; }
  d.exercises.push({ name, sets: [{ kg: '', reps: '' }] });
  rememberName(name); touch(); renderLog();
  const i = d.exercises.length - 1; const k = document.getElementById(`kg-${i}-0`);
  if (k){ k.scrollIntoView({ block: 'center' }); k.focus({ preventScroll: true }); }
}

$('#view-log').addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  const d = ensureDay();
  if (f === 'notes') d.notes = t.value;
  else if (f === 'exname') d.exercises[+t.dataset.ex].name = t.value;
  else if (f === 'kg' || f === 'reps'){
    const ex = d.exercises[+t.dataset.ex]; ex.sets[+t.dataset.set][f] = t.value;
    const v = document.querySelector(`[data-vol="${t.dataset.ex}"]`); if (v) v.textContent = exVol(ex) ? fmtInt(exVol(ex)) + ' kg' : '';
    updateTotals();
  }
  touch();
});
$('#view-log').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'log-date' && t.value){ state.date = t.value; renderLog(); }
  if (t.dataset.f === 'exname'){ rememberName(t.value); saveAll(); renderLog(); }
});
$('#view-log').addEventListener('keydown', e => { if (e.target.id === 'new-ex' && e.key === 'Enter'){ e.preventDefault(); addExercise(e.target.value); } });

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const d = today(), i = +b.dataset.ex, j = +b.dataset.set;
  switch (b.dataset.act){
    case 'prev': state.date = shiftDate(state.date,-1); renderLog(); break;
    case 'next': state.date = shiftDate(state.date, 1); renderLog(); break;
    case 'add-ex': addExercise($('#new-ex').value); break;
    case 'pick': addExercise(b.dataset.name); break;
    case 'edit-names': state.editNames = !state.editNames; renderLog(); break;
    case 'forget': names = names.filter(n => key(n) !== key(b.dataset.name)); saveAll(); renderLog(); break;
    case 'add-set': { const ex = d.exercises[i]; const last = ex.sets[ex.sets.length-1]; ex.sets.push({ kg: last ? last.kg : '', reps: '' }); touch(); renderLog(); const r = document.getElementById(`rp-${i}-${ex.sets.length-1}`); if (r) r.focus(); break; }
    case 'del-set': d.exercises[i].sets.splice(j,1); if (!d.exercises[i].sets.length) d.exercises[i].sets.push({ kg: '', reps: '' }); touch(); renderLog(); break;
    case 'del-ex': armed(b, 'Remove?', () => { d.exercises.splice(i,1); touch(); renderLog(); }); break;
    case 'open-day': state.date = b.dataset.date; switchTab('log'); break;
    case 'del-day': armed(b, 'Tap again to delete', () => { delete days[b.dataset.date]; saveAll(); renderSummary(); toast('Day deleted'); }); break;
    case 'more': state.showDays += 30; renderSummary(); break;
    case 'backup': doBackup(); break;
    case 'restore': $('#restore-file').click(); break;
  }
});
function armed(b, label, fn){
  if (b.dataset.armed){ fn(); return; }
  const old = b.textContent; b.dataset.armed = '1'; b.textContent = label;
  setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = old; } }, 3000);
}

/* ---------- summary ---------- */
function renderSummary(){
  const el = $('#view-summary');
  const dates = Object.keys(days).filter(d => days[d].exercises.some(e => validSets(e).length) || days[d].notes).sort().reverse();
  if (!dates.length){ el.innerHTML = `<div class="empty"><h2>No workouts yet</h2><p>Log your first workout in the Log tab and it will show here, day by day. New phone? Restore your backup below.</p></div>` + backupPanel(); return; }
  let html = backupNudge();
  for (const date of dates.slice(0, state.showDays)){
    const d = days[date];
    const exs = d.exercises.filter(e => validSets(e).length);
    const sets = exs.reduce((t,e) => t + validSets(e).length, 0);
    const vol = exs.reduce((t,e) => t + exVol(e), 0);
    html += `<article class="day">
      <div class="day-h">
        <div><h2>${esc(fmtDate(date))}</h2><div class="meta">${exs.length} exercise${exs.length === 1 ? '' : 's'} · ${sets} set${sets === 1 ? '' : 's'} · ${fmtInt(vol)} kg</div></div>
        <button class="btn sm" data-act="open-day" data-date="${esc(date)}">Edit</button>
      </div>
      <ul>${exs.map(ex => { const prev = previousFor(ex.name, date); const c = compare(ex, prev); return `<li>
        <div class="row"><span class="nm">${esc(ex.name)}</span>${c ? `<span class="cmp ${c.cls}">${esc(c.text)}</span>` : ''}</div>
        <div class="st">${validSets(ex).map(s => esc(fmtSet(s))).join(' · ')}</div>
        ${prev ? `<div class="pv">Last time (${esc(fmtDate(prev.date,false))}): ${validSets(prev.ex).map(s => esc(fmtSet(s))).join(' · ')}</div>` : ''}
      </li>`; }).join('')}</ul>
      ${d.notes ? `<p class="day-notes">${esc(d.notes)}</p>` : ''}
      <div class="day-actions"><button class="btn sm ghost danger" data-act="del-day" data-date="${esc(date)}">Delete day</button></div>
    </article>`;
  }
  if (dates.length > state.showDays) html += `<button class="btn" style="width:100%" data-act="more">Show older days</button>`;
  el.innerHTML = html + backupPanel();
}

/* ---------- backup & restore ---------- */
function backupNudge(){
  const t = lsGet('liftlog.lastBackup', 0); const n = t ? Math.floor((Date.now()-t)/86400000) : null;
  if (n !== null && n < 7) return '';
  return `<div class="nudge"><span>${n === null ? 'You haven’t backed up yet.' : `Last backup was ${n} days ago.`}</span><button class="btn sm primary" data-act="backup">Back up</button></div>`;
}
function backupPanel(){
  const t = lsGet('liftlog.lastBackup', 0);
  const when = t ? new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : 'never';
  return `<section class="backup" aria-labelledby="bk-h">
    <h2 id="bk-h">Backup &amp; restore</h2>
    <p>Your log is stored only on this phone. <b>Back up</b> saves it as one file — choose <b>Save to Files</b> → iCloud Drive. <b>Restore</b> adds a backup back in; nothing here is deleted. Last backup: <b>${esc(when)}</b>.</p>
    <div class="row"><button class="btn primary" data-act="backup">Back up</button><button class="btn" data-act="restore">Restore</button></div>
  </section>
  <p class="foot">Lift Log ${esc(APP_VERSION)}</p>`;
}
async function doBackup(){
  if (!Object.keys(days).length){ toast('Nothing to back up yet'); return; }
  const data = JSON.stringify({ app: 'lift-log', version: 2, appVersion: APP_VERSION, exportedAt: new Date().toISOString(), days, names }, null, 1);
  const name = 'lift-log-backup-' + todayStr() + '.json';
  const done = () => { lsSet('liftlog.lastBackup', Date.now()); if (state.tab === 'summary') renderSummary(); };
  for (const type of ['application/json', 'text/plain']){
    const file = new File([data], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file], title: 'Lift Log backup' }); done(); toast('Backup saved'); }
      catch (err) { if (err && err.name !== 'AbortError') download(data, name, done); }
      return;
    }
  }
  download(data, name, done);
}
function download(data, name, done){
  const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000); done(); toast('Backup downloaded');
}
$('#restore-file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  let p; try { p = JSON.parse(await f.text()); } catch { toast('That file isn’t a Lift Log backup'); return; }
  if (!p || p.app !== 'lift-log'){ toast('That file isn’t a Lift Log backup'); return; }
  const before = Object.keys(days).length;
  if (p.days && typeof p.days === 'object'){
    for (const [date, d] of Object.entries(p.days)){
      if (!d || !Array.isArray(d.exercises) || !/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
      if (!days[date] || (d.updatedAt || 0) > (days[date].updatedAt || 0)) days[date] = { ...d, date };
    }
    for (const n of (p.names || []).slice().reverse()) if (!names.some(x => key(x) === key(n))) names.push(n);
  } else if (Array.isArray(p.sessions)) {
    const saveDays = days; days = {}; importSessions(p.sessions); const incoming = days; days = saveDays;
    for (const [date, d] of Object.entries(incoming)) if (!days[date]) days[date] = d;
  } else { toast('That file isn’t a Lift Log backup'); return; }
  for (const d of Object.values(days)) for (const ex of d.exercises) if (!names.some(x => key(x) === key(ex.name))) names.push(ex.name);
  if (saveAll()) toast(`Restored — ${Object.keys(days).length - before} new day(s) added`);
  renderSummary();
});

/* ---------- shell ---------- */
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function switchTab(t){
  state.tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('#view-log').hidden = t !== 'log'; $('#view-summary').hidden = t !== 'summary';
  if (t === 'log'){ state.editNames = false; renderLog(); } else renderSummary();
  window.scrollTo(0,0);
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) switchTab(b.dataset.tab); });

$('#ver').textContent = APP_VERSION;
const seen = lsGet('liftlog.version', null);
if (seen && seen !== APP_VERSION) setTimeout(() => toast('Updated to ' + APP_VERSION), 400);
lsSet('liftlog.version', APP_VERSION);
// Tidy away settings from older versions
try { ['liftlog.tab','liftlog.pex','liftlog.rest','liftlog.draft'].forEach(k => localStorage.removeItem(k)); } catch {}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
switchTab('log');
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js?v=' + encodeURIComponent(APP_VERSION)).catch(() => {});
})();
</script>
